name: ci

on:
  # Every branch, not just main. A ruleset's required-status-check rule is evaluated
  # against the commit being pushed, and a brand new commit has no `ci` status yet, so a
  # direct push to a protected main is rejected before any run can exist. Running CI on
  # every branch fixes that: push the commit to a branch, let `ci` go green on that exact
  # SHA, then fast-forward the same SHA onto main. The status is already attached to the
  # commit, so the rule is satisfied and the push goes through.
  #
  # The cost is that a pull request from a branch in this repository is built twice, once
  # for the push and once for the pull request. That is the price of being able to push
  # to main at all; the pull_request trigger stays because a fork's branch never fires
  # the push trigger here.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # MinVer derives the version from the tag history, which a shallow clone does
          # not have. Without this every build would think it was at 0.0.0.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DecisionDriven.slnx

      - name: Build
        run: dotnet build DecisionDriven.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test DecisionDriven.slnx --configuration Release --no-build

      - name: Pack
        # No --no-build: the analyzer project builds the code-fixes project in order to pack it,
        # and NoBuild forbids invoking Build on a project reference (NETSDK1085). Everything is
        # already up to date from the step above, so this is incremental rather than a rebuild.
        run: dotnet pack DecisionDriven.slnx --configuration Release --output artifacts/packages

      - name: Check the analyzer package layout
        shell: pwsh
        run: |
          # An analyzer package with a lib/ folder puts the analyzer on the consumer's
          # compile path, which is exactly what TwoPackages.DevelopmentTimeOnly rules out.
          # Cheap to assert, and invisible until somebody consumes the package otherwise.
          $nupkg = Get-ChildItem artifacts/packages/DecisionDriven.Analyzers.*.nupkg |
            Where-Object { $_.Name -notlike '*.symbols.nupkg' } |
            Select-Object -First 1
          if (-not $nupkg) { throw 'No DecisionDriven.Analyzers package was produced.' }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($nupkg.FullName)
          try { $entries = $zip.Entries | ForEach-Object { $_.FullName } } finally { $zip.Dispose() }

          $lib = $entries | Where-Object { $_ -like 'lib/*' }
          if ($lib) { throw "The analyzer package must ship no lib/ assets, but it has: $($lib -join ', ')" }

          # The code-fixes assembly is the half of every rule that dotnet build never loads, so
          # nothing about a green build says it is here. DDBUILD0002 checks it at pack time; this
          # checks the artifact that actually ships.
          foreach ($required in @(
            'analyzers/dotnet/cs/DecisionDriven.Analyzers.dll',
            'analyzers/dotnet/cs/DecisionDriven.Analyzers.CodeFixes.dll',
            'build/DecisionDriven.Analyzers.props',
            'build/DecisionDriven.Analyzers.targets')) {
            if ($entries -notcontains $required) { throw "The analyzer package is missing $required." }
          }

          Write-Host "$($nupkg.Name): no lib/, analyzer and build assets present."

      - name: Check the tool package layout
        shell: pwsh
        run: |
          # A tool package whose tools/ folder holds only DotnetToolSettings.xml packs
          # without complaint and fails at `dotnet tool install`. Assert the entry point
          # the settings file names is actually in the package.
          $nupkg = Get-ChildItem artifacts/packages/DecisionDriven.Report.*.nupkg |
            Where-Object { $_.Name -notlike '*.symbols.nupkg' } |
            Select-Object -First 1
          if (-not $nupkg) { throw 'No DecisionDriven.Report package was produced.' }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($nupkg.FullName)
          try { $entries = $zip.Entries | ForEach-Object { $_.FullName } } finally { $zip.Dispose() }

          $entry = $entries | Where-Object { $_ -like 'tools/*/any/DecisionDriven.Report.dll' }
          if (-not $entry) {
            throw "The tool package has no entry point. tools/ contains: $(($entries | Where-Object { $_ -like 'tools/*' }) -join ', ')"
          }

          Write-Host "$($nupkg.Name): entry point at $entry."

      - name: Upload the packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

  samples:
    name: samples
    runs-on: ubuntu-latest
    # The packages the build job uploaded: the same bytes publish.yml would push. Packing again here
    # would test a package, not the package.
    needs: build

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Download the packages this run built
        uses: actions/download-artifact@v7
        with:
          name: packages
          path: artifacts/packages

      - name: Build the samples against the package
        # Implements RuleTiers.SamplesJobIsTheFalsePositiveCheck, against the artifact that ships
        # rather than the working tree. Every test before this one constructs the analyzers in
        # memory; this is the only check that the nupkg - its analyzer and code-fix assemblies, its
        # build/ props and targets, the generator inside it - loads in a consuming build and fires.
        #
        # The conforming build must be silent, and a diagnostic there is a false positive in the
        # rule until shown otherwise. The violating build must report every id in
        # samples/Consumer/violations.expected exactly once and nothing else; a missing id is a
        # packaging defect until shown otherwise, because the same rule passes its in-memory tests.
        # The script says which, and is the same command a contributor runs locally.
        run: |
          nupkg="$(ls artifacts/packages/DecisionDriven.Analyzers.*.nupkg | grep -v '\.symbols\.nupkg$' | head -n 1)"
          version="$(basename "$nupkg" .nupkg)"
          version="${version#DecisionDriven.Analyzers.}"
          echo "Testing DecisionDriven.Analyzers $version"
          samples/Consumer/check-violations.sh "$version"

      - name: Upload the samples logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: samples-logs
          path: artifacts/samples-logs
          if-no-files-found: ignore

  format:
    name: format
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify formatting
        run: dotnet format DecisionDriven.slnx --verify-no-changes

  ci:
    name: ci
    runs-on: ubuntu-latest
    if: always()
    needs: [build, samples, format]

    steps:
      # One check for the branch ruleset to require, so that adding a job below does not
      # mean editing the ruleset as well.
      - name: Check the results
        run: |
          echo "build:   ${{ needs.build.result }}"
          echo "samples: ${{ needs.samples.result }}"
          echo "format:  ${{ needs.format.result }}"
          [ "${{ needs.build.result }}" = "success" ] || exit 1
          [ "${{ needs.samples.result }}" = "success" ] || exit 1
          [ "${{ needs.format.result }}" = "success" ] || exit 1
