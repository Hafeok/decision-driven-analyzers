name: publish

# Publishing uses NuGet trusted publishing: the workflow proves who it is with a GitHub
# OIDC token and nuget.org hands back an API key that lives for an hour. No key is stored
# as a repository secret, so there is nothing here to leak or to rotate.
#
# The matching policy on nuget.org has to say exactly this or the exchange is refused:
#
#   Repository Owner   Hafeok
#   Repository         decision-driven-analyzers
#   Workflow File      publish.yml          (the file name, not the path)
#   Environment        nuget                (must match the environment named below)
#
# Two identities are involved and they are not the same one. The policy is *owned* by the
# decision-driven-design organisation, which is what makes the organisation the owner of
# the published packages. The token exchange authenticates as the policy's *creator*: the
# individual nuget.org account that registered it. The `user` input below is that account,
# never the organisation - authenticating as the organisation fails with
#
#   HTTP 401: No matching trust policy owned by user 'decision-driven-design' was found
#
# which reads as a missing policy and is really a wrong username.
#
# It is written here as a literal, on the same grounds GOVERNANCE gives for keeping the
# branch rulesets in a file: who may publish this package should be reviewable in a diff
# rather than only on a settings screen. It is not a secret - a nuget.org profile name is
# public - and changing who publishes should be a commit somebody approves.
#
# A policy on a repository that has never published starts out active for seven days only;
# the first successful publish is what makes it permanent.
#
# What gets published, and when (docs/decisions/release-process.md):
#
#   ReleaseProcess.PublishedBytesAreTestedBytes - the files pushed are the `packages` artifact
#   build.yml uploaded in this run, after every check in it passed on those files. Nothing here
#   builds or packs; a repack would produce bytes the samples job never saw.
#
#   ReleaseProcess.TagPublishesOnlyThroughGate - a v* tag starts this run, and the push job
#   waits for the whole of build.yml and then for the `nuget` environment's approval. A tag is
#   a request to publish, not a publish.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "publish" to push the prerelease packages built from this ref to NuGet.
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  checks:
    name: checks
    # The same check set ci.yml runs, on the commit being published, in this run. A green CI
    # run on the same commit elsewhere is not a substitute: its artifacts are not this run's,
    # and nothing would stop a tag pushed before that run finished.
    uses: ./.github/workflows/build.yml

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [checks]

    environment:
      name: nuget
      url: https://www.nuget.org/profiles/decision-driven-design

    permissions:
      # NuGet trusted publishing exchanges this workflow's OIDC token for a short-lived
      # API key. There is no key in repository secrets to leak or to rotate.
      id-token: write
      contents: read

    steps:
      - name: Refuse an unconfirmed manual run
        if: github.event_name == 'workflow_dispatch' && inputs.confirm != 'publish'
        run: |
          echo "Publishing is not undoable: a version pushed to NuGet cannot be replaced."
          echo 'Re-run with the confirmation field set to "publish".'
          exit 1

      - name: Check out global.json
        # Only to pin the SDK that runs `dotnet nuget push`. No source is checked out, so there
        # is nothing here that could be built.
        uses: actions/checkout@v7
        with:
          sparse-checkout: global.json
          sparse-checkout-cone-mode: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Download the packages the checks tested
        # ReleaseProcess.PublishedBytesAreTestedBytes: the artifact build.yml's build job uploaded
        # and its samples job installed, from this run.
        uses: actions/download-artifact@v7
        with:
          name: packages
          path: artifacts/packages

      - name: Report what is about to be published
        shell: bash
        run: |
          ls -l artifacts/packages
          sha256sum artifacts/packages/*

          # A tag names the version it publishes. MinVer derived the packages' version from the
          # same tag, so a mismatch means the artifact is not what the tag asked for.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            for package in DecisionDriven.Analyzers DecisionDriven.Report; do
              if [ ! -f "artifacts/packages/$package.$version.nupkg" ]; then
                echo "Tag $GITHUB_REF_NAME names $version, and there is no $package.$version.nupkg."
                exit 1
              fi
            done
          fi

      - name: Authenticate to NuGet
        # Exchanges the OIDC token for a temporary API key. The policy is owned by the
        # decision-driven-design organisation, which is what makes the organisation own the
        # published packages; the exchange authenticates as the individual who created it.
        # See the note at the top of this file - this is where getting the two confused
        # produces a 401 that looks like a missing policy.
        uses: NuGet/login@v1
        id: login
        with:
          user: hafeok

      - name: Push
        # The run's `packages` artifact is the record of what was published; there is no
        # separate upload of it.
        run: |
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate
