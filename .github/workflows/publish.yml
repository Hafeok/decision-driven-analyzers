name: publish

# Publishing uses NuGet trusted publishing: the workflow proves who it is with a GitHub
# OIDC token and nuget.org hands back an API key that lives for an hour. No key is stored
# as a repository secret, so there is nothing here to leak or to rotate.
#
# The matching policy on nuget.org has to say exactly this or the exchange is refused:
#
#   Repository Owner   Hafeok
#   Repository         decision-driven-analyzers
#   Workflow File      publish.yml          (the file name, not the path)
#   Environment        nuget                (must match the environment named below)
#
# Two identities are involved and they are not the same one. The policy is *owned* by the
# decision-driven-design organisation, which is what makes the organisation the owner of
# the published packages. The token exchange authenticates as the policy's *creator*: the
# individual nuget.org account that registered it. The `user` input below is that account,
# never the organisation - authenticating as the organisation fails with
#
#   HTTP 401: No matching trust policy owned by user 'decision-driven-design' was found
#
# which reads as a missing policy and is really a wrong username.
#
# It comes from the NUGET_USER repository variable rather than being written here as a
# literal. A literal would be more reviewable, on the same grounds as the branch rulesets
# in GOVERNANCE, and that is the better end state; it is a variable because the creator's
# account is a person's identity rather than a property of this code, and nobody should
# have to guess it into a commit. It is a variable and not a secret: a nuget.org profile
# name is public.
#
# A policy on a repository that has never published starts out active for seven days only;
# the first successful publish is what makes it permanent.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "publish" to push the prerelease packages built from this ref to NuGet.
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest

    environment:
      name: nuget
      url: https://www.nuget.org/profiles/decision-driven-design

    permissions:
      # NuGet trusted publishing exchanges this workflow's OIDC token for a short-lived
      # API key. There is no key in repository secrets to leak or to rotate.
      id-token: write
      contents: read

    steps:
      - name: Refuse an unconfirmed manual run
        if: github.event_name == 'workflow_dispatch' && inputs.confirm != 'publish'
        run: |
          echo "Publishing is not undoable: a version pushed to NuGet cannot be replaced."
          echo 'Re-run with the confirmation field set to "publish".'
          exit 1

      - name: Refuse to publish without a policy creator
        if: vars.NUGET_USER == ''
        run: |
          echo "The NUGET_USER repository variable is not set."
          echo
          echo "It is the nuget.org username of the account that CREATED the trusted"
          echo "publishing policy - not decision-driven-design, which OWNS it. Using the"
          echo "organisation fails the token exchange with 'No matching trust policy owned"
          echo "by user ...', which reads as a missing policy and is really a wrong name."
          echo
          echo "Set it under Settings > Secrets and variables > Actions > Variables."
          exit 1

      - name: Check out
        uses: actions/checkout@v7
        with:
          # MinVer reads the tags to decide whether this is a release or a prerelease.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build DecisionDriven.slnx --configuration Release

      - name: Test
        # A tag does not make a red build green. The same tests that gate a pull request
        # gate a release.
        run: dotnet test DecisionDriven.slnx --configuration Release --no-build

      - name: Pack
        # No --no-build: the analyzer project builds the code-fixes project in order to pack it,
        # and NoBuild forbids invoking Build on a project reference (NETSDK1085). Everything is
        # already up to date from the step above, so this is incremental rather than a rebuild.
        run: dotnet pack DecisionDriven.slnx --configuration Release --output artifacts/packages

      - name: Report what is about to be published
        run: ls -l artifacts/packages

      - name: Authenticate to NuGet
        # Exchanges the OIDC token for a temporary API key. The policy is owned by the
        # decision-driven-design organisation, which is what makes the organisation own the
        # published packages; the exchange authenticates as the individual who created it.
        # See the note at the top of this file - this is where getting the two confused
        # produces a 401 that looks like a missing policy.
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push
        run: |
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

      - name: Upload the published packages
        uses: actions/upload-artifact@v7
        with:
          name: published-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
