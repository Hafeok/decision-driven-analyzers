version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: scope
    groups:
      roslyn:
        patterns:
          - "Microsoft.CodeAnalysis*"
      testing:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
      build-tooling:
        patterns:
          - "*"
        exclude-patterns:
          - "Microsoft.CodeAnalysis*"
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
