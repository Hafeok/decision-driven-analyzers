version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: scope
    ignore:
      # build-time-dependencies.RoslynPinnedToLowestSupported pins these to the LOWEST
      # Roslyn the current LTS SDK supports, so that the analyzers load in every SDK of
      # the band. An update is therefore a regression: bumping to the newest Roslyn would
      # stop the package working on 10.0.100 while every build here still passed.
      #
      # These move when the pinned LTS SDK band moves, which is a decision, not a version
      # bump. Left ungated, Dependabot opens the same wrong pull request every week.
      - dependency-name: Microsoft.CodeAnalysis.CSharp
      - dependency-name: Microsoft.CodeAnalysis.CSharp.Workspaces
    groups:
      analyzer-tooling:
        # Not the Roslyn API packages above: these only run during the build, so they are
        # free to track the newest version.
        patterns:
          - "Microsoft.CodeAnalysis.Analyzers"
          - "Microsoft.CodeAnalysis.*Analyzers"
          - "Microsoft.CodeAnalysis.*.Testing"
      testing:
        patterns:
          - "xunit*"
      build-tooling:
        patterns:
          - "*"
        exclude-patterns:
          - "Microsoft.CodeAnalysis*"
          - "xunit*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
