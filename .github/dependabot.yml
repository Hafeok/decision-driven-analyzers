version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: scope
    ignore:
      # build-time-dependencies.RoslynPinnedToLowestSupported pins these to the LOWEST
      # Roslyn the current LTS SDK supports, so that the analyzers load in every SDK of
      # the band. An update is therefore a regression: bumping to the newest Roslyn would
      # stop the package working on 10.0.100 while every build here still passed.
      #
      # These move when the pinned LTS SDK band moves, which is a decision, not a version
      # bump. Left ungated, Dependabot opens the same wrong pull request every week.
      - dependency-name: Microsoft.CodeAnalysis.CSharp
      - dependency-name: Microsoft.CodeAnalysis.CSharp.Workspaces
      # Not free to float either, though it ships no API here. Microsoft.CodeAnalysis.CSharp
      # 5.9.0 requires Analyzers >= 5.9.0, so raising Analyzers on its own makes the pinned
      # Roslyn a package downgrade - and Dependabot resolves that by raising Roslyn too,
      # ignore rule or not. Observed, not predicted: that is how pull request 9 came to bump
      # Microsoft.CodeAnalysis.CSharp while an ignore rule for it was already in place.
      - dependency-name: Microsoft.CodeAnalysis.Analyzers
    groups:
      analyzer-tooling:
        # The harness packages only. Everything Roslyn-versioned is ignored above.
        patterns:
          - "Microsoft.CodeAnalysis.*.Testing"
          - "Microsoft.CodeAnalysis.*Analyzers"
        exclude-patterns:
          - "Microsoft.CodeAnalysis.Analyzers"
      testing:
        patterns:
          - "xunit*"
      build-tooling:
        patterns:
          - "*"
        exclude-patterns:
          - "Microsoft.CodeAnalysis*"
          - "xunit*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
